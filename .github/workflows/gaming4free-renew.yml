name: gaming4free renew (WARP)

on:
  workflow_dispatch:
  schedule:
    - cron: "3 * * * *"   # 每小时第 3 分钟执行（UTC）

jobs:
  run:
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      # =========================
      # 📦 1. Checkout 当前仓库
      # =========================
      - name: Checkout main repo
        uses: actions/checkout@v4

      # =========================
      # 🔒 2. Checkout 私有仓库
      # =========================
      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/gaming4free-auto
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: scripts

      # =========================
      # 🟢 3. Node.js 环境
      # =========================
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # =========================
      # 🐍 4. Python 环境（语音识别）
      # =========================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      # =========================
      # 📦 5. 安装依赖
      # =========================
      - name: Install system & project dependencies
        run: |
          # Node 依赖
          npm init -y
          npm install playwright axios

          # 系统依赖（Playwright + 音频支持）
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            ffmpeg \
            curl \
            pulseaudio \
            fonts-liberation \
            libnss3 \
            libatk-bridge2.0-0 \
            libgtk-3-0 \
            libxss1 \
            libasound2t64

          # Python 依赖
          pip install SpeechRecognition pydub

      # =========================
      # 🎭 6. 安装 Playwright 浏览器
      # =========================
      - name: Install Playwright browsers
        run: |
          npx playwright install chromium

      # =========================
      # 🌐 8. 启用 WARP 网络
      # =========================
      - name: Enable WARP
        uses: fscarmen/warp-on-actions@v1.3
        with:
          stack: dual
          mode: client

      # =========================
      # ▶️ 9. 执行脚本
      # =========================
      - name: Run script
        run: |
          mkdir -p scripts/screenshots
          xvfb-run -a node scripts/renew.js

      # =========================
      # 📤 10. 上传截图
      # =========================
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: scripts/screenshots/**
          if-no-files-found: warn