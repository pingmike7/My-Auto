name: VPS8 Daily Auto

on:
  workflow_dispatch:

  schedule:
    # UTC 16:10
    - cron: '10 16 * * *'

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      # =========================
      # 📥 主仓库
      # =========================
      - name: Checkout main repo
        uses: actions/checkout@v4

      # =========================
      # 🔐 拉取私库
      # =========================
      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/vps8-daily
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: scripts

      # =========================
      # ⏳ 随机延迟
      # =========================
      - name: Random delay
        run: |
          delay=$((RANDOM % 120))

          echo "⏳ 随机延迟: ${delay}s"

          sleep $delay

      # =========================
      # 🐍 Python
      # =========================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # =========================
      # 📦 系统依赖（精简）
      # =========================
      - name: Install system deps
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            xvfb \
            curl \
            wget \
            unzip \
            p7zip-full

      # =========================
      # 🐍 安装 Python 依赖
      # =========================
      - name: Install Python deps
        run: |
          python -m pip install --upgrade \
            pip \
            setuptools \
            wheel

          pip install \
            playwright \
            requests \
            pysocks

          playwright install chromium

      # =========================
      # 📦 下载 NopeCHA
      # =========================
      - name: Download NopeCHA extension
        run: |
          mkdir -p scripts/extensions/nopecha

          wget -q \
            -O scripts/extensions/nopecha/chromium.zip \
            https://github.com/NopeCHALLC/nopecha-extension/releases/latest/download/chromium.zip

      # =========================
      # 📦 解压 NopeCHA
      # =========================
      - name: Unpack NopeCHA extension
        run: |
          mkdir -p scripts/extensions/nopecha/unpacked

          7z x -y \
            scripts/extensions/nopecha/chromium.zip \
            -oscripts/extensions/nopecha/unpacked

          echo "📌 manifest.json"

          cat scripts/extensions/nopecha/unpacked/manifest.json

      # =========================
      # 🚀 安装 Hysteria2
      # =========================
      - name: Install Hysteria2
        run: |
          curl -L \
            -o hysteria \
            https://github.com/apernet/hysteria/releases/latest/download/hysteria-linux-amd64

          chmod +x hysteria

          sudo mv hysteria /usr/local/bin/

          hysteria version

      # =========================
      # 📂 创建截图目录
      # =========================
      - name: Prepare screenshots dir
        run: |
          mkdir -p screenshots

      # =========================
      # ▶️ 执行脚本
      # =========================
      - name: Run Script
        env:
          VPS8_BATCH: ${{ secrets.VPS8_BATCH }}

          VPS8_HY2_URL: ${{ secrets.VPS8_HY2_URL }}

          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

        run: |
          echo "🚀 Start VPS8 Auto"

          xvfb-run -a \
            --server-args="-screen 0 1920x1080x24" \
            python3 scripts/main.py

      # =========================
      # 📤 上传截图
      # =========================
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots

          path: screenshots/**/*.png

          if-no-files-found: ignore

          compression-level: 6

          retention-days: 3