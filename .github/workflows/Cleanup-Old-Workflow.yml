name: Cleanup Old Workflow Runs

on:
  schedule:
    - cron: '0 3 * * 5' # 每周五 UTC 03:00（北京时间 11:00）
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ 安装 gh CLI
      - name: Setup tools
        run: |
          sudo apt update
          sudo apt install -y gh jq

      # 2️⃣ 清理 workflow runs
      - name: 清理运行历史
        if: always()
        uses: MajorScruffy/delete-old-workflow-runs@v0.3.0
        with:
          repository: ${{ github.repository }}
          older-than-seconds: 604800   # 7天
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # 3️⃣ 清理 artifacts（带 gh 认证修复）
      - name: 清理旧 artifacts
        if: always()
        run: |
          echo "📦 Cleaning artifacts older than 7 days..."

          export GH_TOKEN=${{ github.token }}

          cutoff=$(date -u -d "7 days ago" +%s)

          LOG_BODY=""

          artifacts=$(gh api repos/${{ github.repository }}/actions/artifacts --paginate --jq '.artifacts[] | "\(.id) \(.created_at)"')

          if [ -z "$artifacts" ]; then
            LOG_BODY="• No artifacts found\n"
          else
            while read -r id created_at; do
              created_ts=$(date -d "$created_at" +%s)

              if [ "$created_ts" -lt "$cutoff" ]; then
                echo "Deleting artifact $id"
                gh api -X DELETE repos/${{ github.repository }}/actions/artifacts/$id
                LOG_BODY="$LOG_BODY• Deleted artifact $id\n"
              fi
            done <<< "$artifacts"
          fi

          echo -e "$LOG_BODY" > cleanup-log.txt

      # 4️⃣ Checkout repo
      - name: Checkout repo
        uses: actions/checkout@v4

      # 5️⃣ 写入 README（覆盖最新记录）
      - name: Update README log
        run: |
          TIME=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')

          echo "### 🧹 Cleanup Log ($TIME)" > README.md
          echo "" >> README.md
          cat cleanup-log.txt >> README.md

      # 6️⃣ Commit & push
      - name: Commit README update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add README.md

          git diff --cached --quiet || (
            git commit -m "🧹 Cleanup workflow runs & artifacts log"
            git push
          )