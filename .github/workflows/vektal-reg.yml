name: vektal Register (WARP) py

on:
  workflow_dispatch:
  schedule:
    - cron: "10 */5 * * *"   # 每天 18:00 UTC 等时间触发

jobs:
  run:
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      # =========================
      # 0️⃣ checkout 主仓库
      # =========================
      - name: Checkout main repo
        uses: actions/checkout@v4

      # =========================
      # 1️⃣ checkout 脚本仓库
      # =========================
      - name: Checkout scripts repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/teoheberg-reg
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: scripts

      # ------------------------------
      # 2️⃣ 安装 Python
      # ------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # ------------------------------
      # 3️⃣ 安装依赖及系统组件
      # ------------------------------
      - name: Install Dependencies
        run: |
          # 更新包管理器并安装 xvfb 虚拟屏幕组件
          sudo apt-get update
          sudo apt-get install -y xvfb
          
          # 升级基础构建工具
          python -m pip install --upgrade pip setuptools wheel
          
          # 安装 DrissionPage 及脚本所需的周边依赖
          # 注意：这里补上了 pyvirtualdisplay
          pip install DrissionPage requests pyvirtualdisplay psutil

      # =========================
      # 4️⃣ WARP 网络
      # =========================
      - name: Enable WARP
        uses: fscarmen/warp-on-actions@v1.3
        with:
          stack: dual
          mode: client

      # =========================
      # 5️⃣ 检查 IP（确认 WARP）
      # =========================
      - name: Check IP
        run: |
          echo "🌍 Current IP:"
          curl -s https://api.ipify.org
          echo ""
          curl -s https://ipinfo.io

      # =========================
      # 6️⃣ 运行脚本
      # =========================
      - name: Run script
        run: |
          cd scripts
          mkdir -p screenshots
          # 修正了文件后缀名，并直接调用 python（脚本内部会自动管理 Xvfb）
          python vektal_register.py

      # =========================
      # 7️⃣ 上传截图
      # =========================
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: scripts/screenshots/**
          if-no-files-found: warn
