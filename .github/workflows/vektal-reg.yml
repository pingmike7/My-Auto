name: vektal Register (WARP)

on:
  workflow_dispatch:

  schedule:
    - cron: "10 */5 * * *"   # 每天 18:00 UTC

jobs:
  run:
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      # =========================
      # 0️⃣ checkout 主仓库
      # =========================
      - uses: actions/checkout@v4

      # =========================
      # 1️⃣ checkout 脚本仓库
      # =========================
      - name: Checkout scripts repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/teoheberg-reg
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: scripts

      # =========================
      # 2️⃣ Node 环境
      # =========================
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # =========================
      # 3️⃣ WARP 网络
      # =========================
      - name: Enable WARP
        uses: fscarmen/warp-on-actions@v1.3
        with:
          stack: dual
          mode: client

      # =========================
      # 4️⃣ 系统依赖
      # =========================
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb wget unzip curl jq p7zip-full \
            pulseaudio alsa-utils ffmpeg

          pulseaudio --start --exit-idle-time=-1 || true

          pactl load-module module-null-sink sink_name=virtual_speaker || true
          pactl set-default-sink virtual_speaker || true

          pactl load-module module-virtual-source source_name=virtual_mic || true
          pactl set-default-source virtual_mic || true

      # =========================
      # 5️⃣ 安装 Playwright + Stealth（关键修复）
      # =========================
      - name: Install dependencies
        run: |
          cd scripts

          npm init -y

          npm install playwright playwright-extra puppeteer-extra-plugin-stealth

          npx playwright install chromium

      # =========================
      # 6️⃣ 检查 IP（确认 WARP）
      # =========================
      - name: Check IP
        run: |
          echo "🌍 Current IP:"
          curl -s https://api.ipify.org
          echo ""
          curl -s https://ipinfo.io

      # =========================
      # 7️⃣ 运行脚本
      # =========================
      - name: Run script
        run: |
          cd scripts
          mkdir -p screenshots
          xvfb-run -a node vektal_register.js

      # =========================
      # 8️⃣ 上传截图
      # =========================
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: scripts/screenshots/**
          if-no-files-found: warn
